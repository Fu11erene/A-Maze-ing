[project]
name = "a-maze-ing"
version = "0.1.0"
description = "42 project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name="mazegen"